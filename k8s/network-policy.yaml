apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: security-monitor-default }
spec:
  podSelector: { matchLabels: { app: security-monitor } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { name: monitoring } } }]
      ports: [{ protocol: TCP, port: 3002 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { name: monitoring } } }]

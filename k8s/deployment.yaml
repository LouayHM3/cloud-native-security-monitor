apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-monitor
  labels: { app: security-monitor }
spec:
  replicas: 2
  selector: { matchLabels: { app: security-monitor } }
  template:
    metadata: { labels: { app: security-monitor } }
    spec:
      containers:
        - name: monitor
          image: ghcr.io/louayhm3/cloud-native-security-monitor:latest
          ports: [{ containerPort: 3002 }]
          securityContext: { runAsNonRoot: true, allowPrivilegeEscalation: false }
          readinessProbe: { httpGet: { path: /health, port: 3002 } }
---
apiVersion: v1
kind: Service
metadata: { name: security-monitor }
spec:
  selector: { app: security-monitor }
  ports: [{ port: 3002, targetPort: 3002 }]
